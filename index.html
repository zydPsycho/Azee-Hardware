<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AZEE HARDWARE</title>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash" class="splash">
  <div class="splash-mark">
    <svg viewBox="0 0 64 64" width="56" height="56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 8h10v8a6 6 0 006 6h0a6 6 0 006-6V8h2a2 2 0 012 2v10a10 10 0 01-8 9.8V44a6 6 0 01-6 6h-2a6 6 0 01-6-6V29.8A10 10 0 0116 20V10a2 2 0 012-2z" stroke="var(--azee-blue)" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="26" cy="52" r="3.4" fill="var(--azee-red)"/>
    </svg>
  </div>
  <div class="splash-word">AZEE</div>
  <div class="splash-word splash-word--sub">HARDWARE</div>
  <div class="splash-credit">CREDITS: BLACKMARK</div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="app hidden">

  <header id="topbar" class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="topbarTitle" class="topbar-title">AZEE HARDWARE</h1>
    <button id="searchBtn" class="icon-btn" aria-label="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="view" class="view"></main>

  <nav id="bottomnav" class="bottomnav">
    <button class="navbtn" data-route="home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 001 1h4v-6h2v6h4a1 1 0 001-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button class="navbtn" data-route="works">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="13" rx="1.5" stroke="currentColor" stroke-width="2"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7" stroke="currentColor" stroke-width="2"/></svg>
      <span>Works</span>
    </button>
    <button class="navbtn navbtn--add" data-route="add-work">
      <span class="fab"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <span>Add</span>
    </button>
    <button class="navbtn" data-route="reports">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Reports</span>
    </button>
    <button class="navbtn" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V20a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.56 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H4a2 2 0 110-4h.09a1.7 1.7 0 001.56-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H10a1.7 1.7 0 001-1.55V4a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V10a1.7 1.7 0 001.55 1H20a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- Confirm dialog -->
<div id="confirmOverlay" class="overlay hidden">
  <div class="sheet confirm-sheet">
    <div id="confirmTitle" class="confirm-title">Are you sure?</div>
    <div id="confirmBody" class="confirm-body"></div>
    <div class="confirm-actions">
      <button id="confirmCancel" class="btn btn--ghost">Cancel</button>
      <button id="confirmOk" class="btn btn--danger">Delete</button>
    </div>
  </div>
</div>

<!-- Bottom sheet generic (used for pickers) -->
<div id="sheetOverlay" class="overlay hidden">
  <div id="sheetContent" class="sheet"></div>
</div>

<!-- Progress overlay (PDF generation etc.) -->
<div id="progressOverlay" class="overlay hidden">
  <div class="progress-box">
    <div class="spinner"></div>
    <div id="progressText">Working…</div>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/pdf-generator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
